<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Internal Tool Login | GrowGigs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-soft); }
  .login-card {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow-lg); padding: 32px;
  }
  .login-card h1 { font-size: 1.25rem; margin: 0 0 6px; }
  .login-card p.sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; margin-bottom: 12px; box-sizing: border-box;
  }
  .login-card button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px; background: var(--green);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 0.95rem;
  }
  .login-card button:hover { background: var(--green-dark); }
  .error { color: #c0392b; font-size: 0.85rem; margin: 0 0 12px; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <h1>Internal Tool</h1>
  <p class="sub">Review Report Tool — team access only.</p>
  <p class="error" id="error"></p>
  <form id="login-form">
    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
  </form>
</div>

<script type="module">
  import { API_BASE } from "./tools/api-config.js";

  document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorEl = document.getElementById("error");
    errorEl.style.display = "none";
    var password = document.getElementById("password").value;
    try {
      var res = await fetch(API_BASE + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password }),
      });
      var data = await res.json();
      if (res.ok && data.ok && data.token) {
        localStorage.setItem("gg_tools_token", data.token);
        window.location.href = "/tools/";
      } else {
        errorEl.textContent = data.error || "Incorrect password.";
        errorEl.style.display = "block";
      }
    } catch (err) {
      errorEl.textContent = "Something went wrong. Try again.";
      errorEl.style.display = "block";
    }
  });
</script>

</body>
</html>
